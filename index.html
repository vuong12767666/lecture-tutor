<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture Tutor</title>
    <!-- Lets phones install the site as an app, with its own icon, opening full screen. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2f5fd0" />
    <meta name="apple-mobile-web-app-title" content="Lectures" />
    <!-- Sets a saved dark mode before the page first paints, so it never flashes light.
         The key matches THEME_STORAGE_KEY in src/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {
        // Storage is blocked: stay in light mode.
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D8avAlPr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BeuV6GTG.css">
  </head>
  <body>
    <div class="page-tools">
      <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
    </div>
    <main id="app"></main>
  </body>
</html>
